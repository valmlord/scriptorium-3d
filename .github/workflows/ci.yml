name: ci

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
  schedule:
    # Nightly mutation run (ADR-0008), at 02:17 UTC — off the hour, because
    # every job scheduled on the hour queues behind everyone else's.
    - cron: '17 2 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  changes:
    # Does this event concern the layer Stryker is responsible for? This job
    # must not be conditional: a skipped job counts as an unmet dependency in
    # GitHub Actions, so gating it with `if:` would silently skip the nightly
    # mutation run along with it. The schedule case is answered here instead.
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes under src/core
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          core=false
          case "$EVENT_NAME" in
            schedule)
              # The nightly run covers src/core whether or not it changed.
              core=true
              ;;
            pull_request)
              git fetch --no-tags origin "$BASE_REF"
              base="$(git merge-base "origin/$BASE_REF" HEAD)"
              if ! git diff --quiet "$base" HEAD -- src/core; then
                core=true
              fi
              ;;
            push)
              # A branch's first push has an all-zero `before` and nothing to
              # diff against. The pull request for that branch runs this job
              # again with a real base, so there is nothing to miss.
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                if ! git diff --quiet "$BEFORE" HEAD -- src/core; then
                  core=true
                fi
              fi
              ;;
          esac
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "src/core touched: $core"

  mutation:
    # Mutation testing is minutes, not seconds (ADR-0008), so it does not run
    # on every push — only when src/core changed, and nightly regardless.
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mutation testing
        run: npm run test:mutation

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
