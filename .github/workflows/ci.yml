name: ci

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
  schedule:
    # Nightly mutation run (ADR-0008), at 02:17 UTC — off the hour, because
    # every job scheduled on the hour queues behind everyone else's.
    - cron: '17 2 * * *'
  # `schedule` fires only on the default branch, so without this a feature
  # branch could not get a mutation score at all before it merged (ADR-0014).
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  mutation-dry-run:
    # The cheap half of the mutation harness: does Stryker still start, find its
    # files, and get a green suite out of the instrumented run? That is exactly
    # what broke on ae0af83, where it took two CI runs on one commit before the
    # failure was even visible. It costs about fifteen seconds against the full
    # run's twenty-one to fifty-nine minutes, so it is what the pull request
    # path gets (ADR-0014).
    #
    # Deliberately unconditional. Gating it on which files changed would buy
    # back fifteen seconds and cost the skipped-job dependency subtlety the
    # deleted `changes` job was written to work around.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the mutation harness still runs
        run: npm run test:mutation:dry

  mutation:
    # The full run is twenty-one to fifty-nine minutes and its verdict is not
    # reproducible: 56 of 587 mutant positions changed verdict between two runs
    # whose `src/` trees were identical, moving the score 98.32 to 93.43. A gate
    # that swings five points on unchanged code does not belong on the pull
    # request path, so it is nightly on `main` plus `workflow_dispatch` for a
    # branch that wants a number before it merges (ADR-0014, issue #6).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mutation testing
        run: npm run test:mutation

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
