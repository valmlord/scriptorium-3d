name: ci

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
  schedule:
    # Nightly mutation run (ADR-0008), at 02:17 UTC — off the hour, because
    # every job scheduled on the hour queues behind everyone else's.
    - cron: '17 2 * * *'
  # `schedule` fires only on the default branch, so without this a feature
  # branch could not get a mutation score at all before it merged (ADR-0014).
  workflow_dispatch:

jobs:
  format:
    # Its own job rather than a step inside `verify`, for two reasons. A red check
    # named `format` says what is wrong before anyone opens a log, where a red
    # `verify` could be any of four things. And an independent job still reports when
    # `verify` has failed for an unrelated reason, so one push surfaces both problems
    # instead of hiding the drift behind a type error.
    #
    # `npm run verify` runs `format:check` as well, so a local run catches drift
    # before a push. That is the convenience; this job is the authority
    # (code-style.md section 8). Until this existed, the only enforcement was
    # `lint-staged` through the Husky pre-commit hook, which sees the files one local
    # commit stages and nothing else -- and four documents had been unformatted since
    # dd0c833 without CI noticing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Say how to fix it
        if: failure()
        run: |
          echo "::error::Prettier reported unformatted files above. Run 'npm run format' and commit the result."

  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  mutation-dry-run:
    # The cheap half of the mutation harness: does Stryker still start, find its
    # files, and get a green suite out of the instrumented run? That is exactly
    # what broke on ae0af83, where it took two CI runs on one commit before the
    # failure was even visible. Measured on run 41473984542: 34 seconds for the
    # whole job, 20 of them the dry run itself, against the full run's
    # twenty-one to fifty-nine minutes. It also adds nothing to the critical
    # path, which `e2e` holds at 109 seconds -- so this is what the pull request
    # path gets (ADR-0014).
    #
    # Deliberately unconditional. Gating it on which files changed would buy
    # back a job that runs in parallel with a longer one anyway, and cost the
    # skipped-job dependency subtlety the deleted `changes` job was written to
    # work around.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the mutation harness still runs
        run: npm run test:mutation:dry

  mutation:
    # The full run is twenty-one to fifty-nine minutes and its verdict is not
    # reproducible: 56 of 587 mutant positions changed verdict between two runs
    # whose `src/` trees were identical, moving the score 98.32 to 93.43. A gate
    # that swings five points on unchanged code does not belong on the pull
    # request path, so it is nightly on `main` plus `workflow_dispatch` for a
    # branch that wants a number before it merges (ADR-0014, issue #6).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mutation testing
        run: npm run test:mutation

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
